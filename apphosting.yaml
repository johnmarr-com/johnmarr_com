# Firebase App Hosting configuration
# https://firebase.google.com/docs/app-hosting/configure

runConfig:
  cpu: 1
  memoryMiB: 512
  concurrency: 80
  # Keep one instance always warm to avoid Cloud Run cold starts ("spin up").
  # Idle is billed memory-only (~$3/month) under request-based CPU billing.
  minInstances: 1

env:
  # Non-secret environment variables
  - variable: RESEND_TEMPLATE_ID
    value: "account-activation"
  - variable: FIREBASE_PROJECT_ID
    value: "johnmarr-com"
  - variable: NEXT_PUBLIC_APP_URL
    value: "https://johnmarr.com"

  # Secret environment variables (set via: firebase apphosting:secrets:set <NAME>)
  - variable: RESEND_API_KEY
    secret: RESEND_API_KEY
  - variable: FIREBASE_CLIENT_EMAIL
    secret: FIREBASE_CLIENT_EMAIL
  - variable: FIREBASE_PRIVATE_KEY
    secret: FIREBASE_PRIVATE_KEY
  - variable: ANTHROPIC_API_KEY
    secret: ANTHROPIC_API_KEY
  - variable: IDEOGRAM_API_KEY
    secret: IDEOGRAM_API_KEY
  # Neon Postgres (trivia content pipeline / Trivia Review admin panel).
  # Was never wired into App Hosting — trivia-review routes 500'd in prod
  # with "NEON_URL missing from environment" (only ever worked on localhost).
  - variable: NEON_URL
    secret: NEON_URL
